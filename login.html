<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="reference-bg">
    <header class="top-accent"> </header>

    <div class="content-container">
        <div class="data-card">
            <h2 class="form-title">User Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email Address" required>
                <div class="password-box">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="button" id="toggleLoginPassword" class="eye-btn">👁️</button>
                </div>
                <button type="submit" class="action-btn onclick=" location.href='dashboard.h " >LOGIN</button>
                <p id="login-error" class="error"></p>
            </form>
            <p class="footer-text">Need an account? <a href="index.html">Register</a></p>
        </div>
    </div>
    <script src="auth.js"></script>
</body>

</html>
