<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="reference-bg">
    <!-- Decorative Top Accent Bar (matches photo style but no text) -->
    <header class="top-accent"></header>

    <div class="content-container">
        <!-- Minimal Data Card -->
        <div class="data-card">
            <h2 class="form-title">Create Account</h2>
            <form id="registrationForm">
                <input type="text" id="userName" placeholder="Full Name" required>
                <input type="email" id="userEmail" placeholder="Email Address" required>
                
                <div class="form-row">
                    <select id="userGender" required>
                        <option value="" disabled selected>Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                    <input type="number" id="userAge" placeholder="Age" required>
                </div>

                <div class="password-box">
                    <input type="password" id="userPassword" placeholder="Password" required>
                    <button type="button" id="toggleRegPassword" class="eye-btn">👁️</button>
                </div>
                
                <div class="rules-box">
                    <span id="hint-cap">❌ Capital</span>
                    <span id="hint-num">❌ Number</span>
                    <span id="hint-spec">❌ Special</span>
                </div>

                <button type="submit" class="action-btn">SIGN UP</button>
            </form>
            <p class="footer-text">Already a member? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
